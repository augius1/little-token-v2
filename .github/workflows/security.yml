name: 🔐 Security & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool: [build, slither, echidna, diligence, solidityscan, defiscanner]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Build & Test
      - if: matrix.tool == 'build'
        name: Setup Node.js & Install Dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - if: matrix.tool == 'build'
        run: npm ci
      - if: matrix.tool == 'build'
        run: npx hardhat compile --show-stack-traces
      - if: matrix.tool == 'build'
        run: npx hardhat test --network hardhat

      # Slither Static Analysis
      - if: matrix.tool == 'slither'
        name: Run Slither
        uses: crytic/slither-action@v0.4.1
        with:
          solc-version: 0.8.20
          fail-on: high

      # Echidna Invariant Fuzzing
      - if: matrix.tool == 'echidna'
        name: Run Echidna
        uses: crytic/echidna-action@v2.0.2
        with:
          solc-version: 0.8.20
          echidna-version: latest
          files: contracts/EchidnaHarness.sol
          negate-exit-status: false

      # Diligence Fuzzing
      - if: matrix.tool == 'diligence'
        name: Install Diligence Fuzzing CLI
        run: python3 -m pip install diligence-fuzzing
      - if: matrix.tool == 'diligence'
        name: Run Diligence Fuzzing Campaign
        env:
          FUZZ_API_KEY: ${{ secrets.FUZZ_API_KEY }}
          RPC_URL: "http://127.0.0.1:8545"
        run: |
          npx hardhat node &
          sleep 3
          fuzz run --config .fuzz.yml

      # SolidityScan QuickScan
      - if: matrix.tool == 'solidityscan'
        name: Run SolidityScan QuickScan
        env:
          SOLIDITYSCAN_API_KEY: ${{ secrets.SOLIDITYSCAN_API_KEY }}
        run: |
          curl -X POST https://api.solidityscan.com/quickscan \
            -H "x-api-key: $SOLIDITYSCAN_API_KEY" \
            -F "source=@./contracts"

      # De.fi Scanner QuickScan
      - if: matrix.tool == 'defiscanner'
        name: Run De.fi Scanner QuickScan
        env:
          DEFISCANNER_TOKEN: ${{ secrets.DEFISCANNER_TOKEN }}
        run: |
          curl -X POST https://api.defi-scanner.com/quickscan \
            -H "Authorization: Bearer $DEFISCANNER_TOKEN" \
            -F "repoUrl=https://github.com/${{ github.repository }}" \
            -F "branch=${{ github.ref_name }}"
